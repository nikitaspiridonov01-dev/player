<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AirPlay Any — test page</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    video { width: 640px; height: 360px; background: #333; display: block; margin: 16px 0; }
    iframe { width: 640px; height: 400px; border: 1px solid #999; display: block; margin: 16px 0; }
    #tiny { width: 80px; height: 45px; }
  </style>
</head>
<body>
  <h1>Test page</h1>
  <p>Native MP4 with AirPlay disabled by the site:</p>
  <video id="native" src="/media/clip.mp4" disableremoteplayback x-webkit-airplay="deny" controls></video>
  <p>MSE player (blob:) backed by HLS:</p>
  <video id="mse" controls></video>
  <p>MSE player backed by DASH only:</p>
  <video id="dash" controls></video>
  <p>Tiny decorative video (no badge expected):</p>
  <video id="tiny" src="/media/tiny.mp4" muted loop></video>
  <p>Embedded frame:</p>
  <iframe id="frame" src="/frame.html"></iframe>
  <script src="/player.js"></script>
</body>
</html>
